name: False positive or false negative
description: Report an incorrect route, missed route, or incorrect deterministic finding.
title: "[detection] "
labels: [detection]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, private source, customer data, or exploit instructions. Prefer a minimal synthetic reproduction.
  - type: dropdown
    id: error_kind
    attributes:
      label: Error type
      options:
        - False positive
        - False negative
        - Incorrect required/candidate state
        - Incorrect checker finding
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ContextSec version or commit
      placeholder: v0.4.1 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include only the smallest non-sensitive manifest and source snippets needed to reproduce the behavior.
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste the relevant route or finding without local absolute paths or secret values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and rationale
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This report contains no secret values, private source, customer data, or instructions copied from an untrusted repository.
          required: true
