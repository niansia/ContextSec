name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile deterministic tooling
        run: python -m compileall -q .agents/skills/contextsec/scripts tests
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test public CLI (Windows)
        if: runner.os == 'Windows'
        run: python .agents\skills\contextsec\scripts\contextsec.py benchmark --suite all
      - name: Smoke-test public CLI (macOS and Linux)
        if: runner.os != 'Windows'
        run: python .agents/skills/contextsec/scripts/contextsec.py benchmark --suite all

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Run all offline benchmark suites
        run: python .agents/skills/contextsec/scripts/contextsec.py benchmark --suite all
      - name: Validate decision catalogs
        run: python .agents/skills/contextsec/scripts/contextsec.py validate-catalog
      - name: Verify clean release allowlist
        run: python .agents/skills/contextsec/scripts/package_release.py --list
      - name: Verify byte-identical release archives
        run: |
          python .agents/skills/contextsec/scripts/package_release.py --output /tmp/contextsec-first.zip
          python .agents/skills/contextsec/scripts/package_release.py --output /tmp/contextsec-second.zip
          cmp /tmp/contextsec-first.zip /tmp/contextsec-second.zip
      - name: Dogfood profile, checks, and ledger
        run: |
          python .agents/skills/contextsec/scripts/contextsec.py profile --repo . --output contextsec-profile.json
          python .agents/skills/contextsec/scripts/contextsec.py validate-profile contextsec-profile.json
          python .agents/skills/contextsec/scripts/contextsec.py check --repo . --output contextsec-checks.json
          python .agents/skills/contextsec/scripts/contextsec.py validate-checks contextsec-checks.json
          python .agents/skills/contextsec/scripts/contextsec.py gate --repo examples/next-static --output contextsec-ledger.json
          python .agents/skills/contextsec/scripts/contextsec.py validate-ledger contextsec-ledger.json

  agent-skill-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Agent Skills reference at a fixed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agentskills/agentskills
          ref: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          path: .vendor/agentskills
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install the pinned reference validator
        run: python -m pip install ./.vendor/agentskills/skills-ref
      - name: Validate the ContextSec skill
        run: skills-ref validate .agents/skills/contextsec

  real-repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out ContextSec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Merriv case
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: niansia/Merriv
          ref: 2fed8dc98273bb838920a0b5f06a79222f051e16
          path: real-repos/Merriv
          persist-credentials: false
      - name: Check out FastAPI template case
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fastapi/full-stack-fastapi-template
          ref: 486f054cc8d1aead59ec96cc0a16933d06c10e0d
          path: real-repos/fastapi-template
          persist-credentials: false
      - name: Check out Stripe case
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stripe-samples/accept-a-payment
          ref: 1a57c3b2f5aaf4ecd8de59ab0b1c3c5638827625
          path: real-repos/stripe-accept-payment
          persist-credentials: false
      - name: Check out OpenAI quickstart case
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/openai-quickstart-node
          ref: 6e6e03496440913a82ccba6f17c2f41caa948c58
          path: real-repos/openai-quickstart-node
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Profile pinned repositories without executing them
        run: python .agents/skills/contextsec/scripts/contextsec.py benchmark --suite real-repo --workspace real-repos

  required:
    name: required
    if: ${{ always() }}
    needs: [test, evidence, agent-skill-spec, real-repositories]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI proof lane
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.evidence.result }}" = "success"
          test "${{ needs.agent-skill-spec.result }}" = "success"
          test "${{ needs.real-repositories.result }}" = "success"
