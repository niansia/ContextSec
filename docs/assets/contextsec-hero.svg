<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">ContextSec — product-security decisions backed by evidence</title>
  <desc id="description">ContextSec turns bounded product evidence into applicable controls, explicit unknowns, and an evidence-backed release gate. Research preview version 0.4.1.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f6f8fa;
      --surface: #ffffff;
      --surface-2: #eef2f6;
      --text: #111827;
      --muted: #536173;
      --line: #d0d7de;
      --accent: #d95d39;
      --accent-soft: #fff0eb;
      --blue: #2563eb;
      --blue-soft: #e8f0ff;
      --green: #087f5b;
      --green-soft: #e3f7ef;
      --violet: #7048b8;
      --violet-soft: #f0eafa;
      --danger: #b42318;
      --danger-soft: #feeceb;
      --grid: #d8dee6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #0d1117;
        --surface: #161b22;
        --surface-2: #1c232d;
        --text: #f0f6fc;
        --muted: #9da7b3;
        --line: #30363d;
        --accent: #f08363;
        --accent-soft: #3d231d;
        --blue: #79b8ff;
        --blue-soft: #182d46;
        --green: #56d4a0;
        --green-soft: #17382d;
        --violet: #c5a3ff;
        --violet-soft: #302442;
        --danger: #ff8a80;
        --danger-soft: #401f20;
        --grid: #252c35;
      }
    }

    text {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: var(--text);
    }

    .canvas { fill: var(--canvas); stroke: var(--line); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; opacity: 0.48; }
    .brand { font-size: 50px; font-weight: 800; letter-spacing: 1.8px; }
    .eyebrow { font-size: 12px; font-weight: 760; letter-spacing: 2px; fill: var(--accent); }
    .tagline { font-size: 28px; font-weight: 720; }
    .subline { font-size: 16px; fill: var(--muted); }
    .chip { stroke-width: 1; }
    .chip-text { font-size: 12px; font-weight: 720; letter-spacing: 0.55px; text-anchor: middle; }
    .panel { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .panel-head { font-size: 12px; font-weight: 760; letter-spacing: 1.45px; fill: var(--muted); }
    .stage { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
    .stage-number { font-size: 11px; font-weight: 800; text-anchor: middle; fill: #ffffff; }
    .stage-title { font-size: 15px; font-weight: 720; }
    .stage-note { font-size: 12px; fill: var(--muted); }
    .arrow { stroke: var(--line); stroke-width: 1.5; }
    .gate { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 1.2; }
    .gate-label { font-size: 12px; font-weight: 760; letter-spacing: 1.25px; fill: var(--danger); }
    .gate-value { font-size: 24px; font-weight: 820; fill: var(--danger); }
    .version { font-size: 13px; font-weight: 760; fill: var(--accent); }
  </style>

  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path class="grid" d="M 26 0 L 0 0 0 26" fill="none" />
    </pattern>
  </defs>

  <rect class="canvas" x="0.5" y="0.5" width="1199" height="439" rx="22" />
  <rect x="1" y="1" width="1198" height="438" rx="21" fill="url(#grid)" opacity="0.42" />
  <path d="M1 22 A21 21 0 0 1 22 1 H330" stroke="var(--accent)" stroke-width="4" fill="none" />

  <g aria-label="ContextSec mark">
    <path d="M62 70 V50 H82 M118 50 H138 V70 M138 106 V126 H118 M82 126 H62 V106" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" />
    <path d="M79 88 H94 L103 77 L118 98" fill="none" stroke="var(--blue)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="118" cy="98" r="5.5" fill="var(--green)" />
  </g>

  <text class="eyebrow" x="164" y="58">PRODUCT-SECURITY DECISION LAYER</text>
  <text class="brand" x="160" y="112">CONTEXTSEC</text>
  <text class="tagline" x="60" y="178">Know what applies. Prove what passed.</text>
  <text class="subline" x="60" y="211">Bounded repository evidence → applicable controls → an explicit release decision.</text>

  <g transform="translate(60 246)">
    <rect class="chip" width="126" height="34" rx="17" fill="var(--blue-soft)" stroke="var(--blue)" />
    <text class="chip-text" x="63" y="22" fill="var(--blue)">LOCAL-FIRST</text>
    <rect class="chip" x="138" width="150" height="34" rx="17" fill="var(--green-soft)" stroke="var(--green)" />
    <text class="chip-text" x="213" y="22" fill="var(--green)">EVIDENCE-BOUND</text>
    <rect class="chip" x="300" width="132" height="34" rx="17" fill="var(--violet-soft)" stroke="var(--violet)" />
    <text class="chip-text" x="366" y="22" fill="var(--violet)">FAIL-CLOSED</text>
  </g>

  <g transform="translate(60 318)">
    <rect width="246" height="58" rx="12" fill="var(--accent-soft)" stroke="var(--accent)" />
    <text class="version" x="18" y="24">RESEARCH PREVIEW · v0.4.1</text>
    <text class="stage-note" x="18" y="43">Windows · macOS · Linux · Python 3.11–3.14</text>
  </g>

  <g transform="translate(746 38)">
    <rect class="panel" width="410" height="364" rx="18" />
    <text class="panel-head" x="24" y="32">ONE REPOSITORY · ONE EXPLICIT DECISION</text>

    <g transform="translate(24 52)">
      <rect class="stage" width="362" height="58" rx="11" />
      <circle cx="27" cy="29" r="13" fill="var(--blue)" />
      <text class="stage-number" x="27" y="33">1</text>
      <text class="stage-title" x="51" y="25">Evidence</text>
      <text class="stage-note" x="51" y="43">routes · schemas · dependencies · workflows</text>
    </g>
    <line class="arrow" x1="205" y1="110" x2="205" y2="124" />

    <g transform="translate(24 124)">
      <rect class="stage" width="362" height="58" rx="11" />
      <circle cx="27" cy="29" r="13" fill="var(--violet)" />
      <text class="stage-number" x="27" y="33">2</text>
      <text class="stage-title" x="51" y="25">Context routing</text>
      <text class="stage-note" x="51" y="43">required · candidate · inactive · unknown</text>
    </g>
    <line class="arrow" x1="205" y1="182" x2="205" y2="196" />

    <g transform="translate(24 196)">
      <rect class="stage" width="362" height="58" rx="11" />
      <circle cx="27" cy="29" r="13" fill="var(--green)" />
      <text class="stage-number" x="27" y="33">3</text>
      <text class="stage-title" x="51" y="25">Controls + verification</text>
      <text class="stage-note" x="51" y="43">no finding never means verified</text>
    </g>
    <line class="arrow" x1="205" y1="254" x2="205" y2="268" />

    <g transform="translate(24 268)">
      <rect class="gate" width="362" height="72" rx="11" />
      <text class="gate-label" x="20" y="26">RELEASE GATE</text>
      <text class="gate-value" x="20" y="55">BLOCK</text>
      <text class="stage-note" x="124" y="47">missing evidence stays visible</text>
    </g>
  </g>
</svg>
